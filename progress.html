<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Starting Remed</title>
  <style>
    :root {
      color-scheme: light;
      --remed-primary: #258fdf;
      --remed-primary-deep: #197cc7;
      --remed-page: #eef2f7;
      --remed-text: #26364a;
      --remed-muted: #607086;
      --remed-track: #e0f0fc;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 88% 0%, rgba(37, 143, 223, 0.12), transparent 42%),
        var(--remed-page);
      color: var(--remed-text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    main {
      width: 100%;
      padding: 26px 30px 28px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .brand-mark {
      width: 40px;
      height: 40px;
      flex: 0 0 auto;
      filter: drop-shadow(0 6px 10px rgba(37, 143, 223, 0.2));
    }

    .brand-mark img {
      display: block;
      width: 100%;
      height: 100%;
    }

    .brand-name {
      margin: 0;
      font-size: 19px;
      font-weight: 650;
      letter-spacing: -0.02em;
    }

    .brand-detail {
      margin: 2px 0 0;
      color: var(--remed-muted);
      font-size: 12px;
    }

    .status-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 9px;
    }

    .message {
      min-width: 0;
      overflow: hidden;
      color: var(--remed-text);
      font-size: 13px;
      font-weight: 550;
      line-height: 1.4;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .percentage {
      flex: 0 0 auto;
      color: var(--remed-muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .progress-track {
      height: 8px;
      overflow: hidden;
      border: 1px solid rgba(37, 143, 223, 0.08);
      border-radius: 999px;
      background: var(--remed-track);
    }

    .progress-bar {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--remed-primary-deep), var(--remed-primary));
      box-shadow: 0 0 10px rgba(37, 143, 223, 0.3);
      transition: width 450ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    @media (prefers-reduced-motion: reduce) {
      .progress-bar { transition: none; }
    }
  </style>
</head>
<body>
  <main aria-labelledby="app-name">
    <div class="brand">
      <div class="brand-mark">
        <img src="./assets/logo.png" alt="">
      </div>
      <div>
        <h1 class="brand-name" id="app-name">Remed</h1>
        <p class="brand-detail">Preparing your workspace</p>
      </div>
    </div>

    <div class="status-row" aria-live="polite">
      <div class="message" id="message">Initializing...</div>
      <div class="percentage" id="percentage">0%</div>
    </div>
    <div class="progress-track" id="progress-track" role="progressbar" aria-label="Launch progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="progress-bar" id="progress"></div>
    </div>
  </main>

  <script>
    const { ipcRenderer } = require('electron');
    const progress = document.getElementById('progress');
    const progressTrack = document.getElementById('progress-track');
    const percentage = document.getElementById('percentage');
    const message = document.getElementById('message');

    ipcRenderer.on('update-progress', (_event, data) => {
      const value = Math.max(0, Math.min(100, Number(data.percentage) || 0));
      progressTrack.setAttribute('aria-valuenow', String(value));
      percentage.textContent = `${value}%`;
      if (data.message) message.textContent = data.message;
      requestAnimationFrame(() => {
        progress.style.width = `${value}%`;
      });
    });
  </script>
</body>
</html>
